name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Montar estrutura do projeto
        run: |
          mkdir -p app/src/main/java/com/example/arfixo
          cp app.gradle.kts app/build.gradle.kts
          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.kt app/src/main/java/com/example/arfixo/MainActivity.kt

      - name: Compilar
        run: gradle assembleDebug -Pandroid.useAndroidX=true --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ARFixo-APK
          path: app/build/outputs/apk/debug/app-debug.apk
